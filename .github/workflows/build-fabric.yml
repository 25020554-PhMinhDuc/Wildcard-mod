name: Build Wildcard Fabric 26.3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén source nếu là file zip
        run: |
          if [ -f wildcard-fabric-src.zip ]; then unzip -o -q wildcard-fabric-src.zip; fi
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'
      - name: Build
        working-directory: wildcard-fabric
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildcard-fabric-jar
          path: wildcard-fabric/build/libs/*.jar
