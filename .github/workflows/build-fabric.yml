name: Build Wildcard Fabric 26.3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén source nếu là file zip
        run: |
          if [ -f wildcard-fabric-src.zip ]; then unzip -o -q wildcard-fabric-src.zip; fi
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'
      - name: Dò phiên bản Fabric cho Minecraft 26.3
        id: v
        run: |
          MC=26.3
          echo "== Các bản Minecraft Fabric hỗ trợ (mới nhất trước):"
          curl -s https://meta.fabricmc.net/v2/versions/game | python3 -c "import json,sys;print([g['version'] for g in json.load(sys.stdin)][:15])"
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['version'])")
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | python3 -c "
          import sys,re
          v=re.findall(r'<version>([^<]+)</version>',sys.stdin.read())
          m=[x for x in v if x.endswith('+$MC') or ('+$MC' in x and x.split('+')[1].startswith('$MC'))]
          print(m[-1] if m else '')")
          LOOM=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | python3 -c "
          import sys,re
          v=re.findall(r'<version>([^<]+)</version>',sys.stdin.read())
          r=[x for x in v if 'SNAPSHOT' not in x]
          print((r or v)[-1] if v else '')")
          echo "loader=$LOADER api=$API loom=$LOOM"
          echo "loader=$LOADER" >> $GITHUB_OUTPUT
          echo "api=$API" >> $GITHUB_OUTPUT
          echo "loom=$LOOM" >> $GITHUB_OUTPUT
      - name: Build
        working-directory: wildcard-fabric
        run: gradle build --no-daemon --stacktrace -Ploader_version=${{ steps.v.outputs.loader }} -Pfabric_api_version=${{ steps.v.outputs.api }} -Ploom_version=${{ steps.v.outputs.loom }}
      - name: Xuất thông tin Minecraft 26.3 (probe)
        if: always()
        working-directory: wildcard-fabric
        run: |
          gradle probe --no-daemon -Ploader_version=${{ steps.v.outputs.loader }} -Pfabric_api_version=${{ steps.v.outputs.api }} -Ploom_version=${{ steps.v.outputs.loom }}
          CP=$(paste -sd: build/probe/classpath.txt)
          : > build/probe/javap.txt
          while read c; do [ -z "$c" ] && continue; echo "######## $c" >> build/probe/javap.txt; javap -p -cp "$CP" "$c" >> build/probe/javap.txt 2>&1 || true; done < probe-classes.txt
          for j in $(grep -i fabric build/probe/classpath.txt); do unzip -l "$j" | grep -oE "net/fabricmc/fabric/api/[A-Za-z0-9/_$]+\.class" ; done | sed 's/\.class$//' | sort -u > build/probe/fabric-api-classes.txt
          for j in $(grep -i minecraft build/probe/classpath.txt); do unzip -l "$j" | grep -oE "net/minecraft/[A-Za-z0-9/_$]+\.class"; done | grep -v '\$' | sed 's/\.class$//' | sort -u > build/probe/mc-classes.txt
          wc -l build/probe/*.txt; ls -la build/probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildcard-fabric-jar
          path: wildcard-fabric/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-text
          path: |
            wildcard-fabric/build/probe/*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-deps
          path: wildcard-fabric/build/probe/deps.zip
